name: Deploy to Firebase Hosting on merge

# A1: Trigger en push hacia main
on:
  push:
    branches:
      - main

# A4: Concurrencia para producción (pone deploys en fila, nunca corta uno a la mitad)
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # A5: GitHub Environment de producción
    environment:
      name: production
      url: https://practicafirebase-3307b.web.app
    steps:
      - uses: actions/checkout@v4

      # A2: Inyección de fecha del build
      - name: Set build date
        run: echo "NEXT_PUBLIC_BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV

      # A3: Credenciales, projectId y channelId de producción (live)
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRACTICAFIREBASE_3307B }}
          channelId: live
          projectId: practicafirebase-3307b
        # A2: Inyección de variables de entorno de build
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_REF: ${{ github.ref_name }}
          NEXT_PUBLIC_BUILD_TIME: ${{ env.NEXT_PUBLIC_BUILD_TIME }}
