name: Deploy to Firebase Hosting on PR

# A1: Trigger en pull_request hacia main
on:
  pull_request:
    branches:
      - main

# A4: Concurrencia para preview (cancela builds obsoletos si hay nuevos commits en el PR)
concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A2: Inyección de fecha del build
      - name: Set build date
        run: echo "NEXT_PUBLIC_BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV

      # A2: Build con variables horneadas en el bundle estático
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          NEXT_PUBLIC_BUILD_REF: ${{ github.head_ref }}
          NEXT_PUBLIC_BUILD_TIME: ${{ env.NEXT_PUBLIC_BUILD_TIME }}

      # A3: Credenciales, projectId y expires para preview
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRACTICAFIREBASE_3307B }}
          projectId: practicafirebase-3307b
          expires: 3d
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          NEXT_PUBLIC_BUILD_REF: ${{ github.head_ref }}
          NEXT_PUBLIC_BUILD_TIME: ${{ env.NEXT_PUBLIC_BUILD_TIME }}

